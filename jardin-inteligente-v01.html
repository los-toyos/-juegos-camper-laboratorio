<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f43">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Jardín Inteligente</title>
<style>
:root{--bg:#f5f7f4;--card:#fff;--ink:#18211b;--muted:#69736b;--line:#dfe6e0;--green:#1f6f43;--soft:#e8f4ec;--blue:#2d83c4;--amber:#a36d17;--purple:#7a4d8c;--shadow:0 7px 28px rgba(20,45,30,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}.app{max-width:760px;margin:auto;padding-bottom:92px}header{padding:calc(16px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}h1{margin:0;font-size:25px}h2{font-size:19px;margin:0 0 12px}.sub{font-size:13px;color:var(--muted)}main{padding:0 14px 24px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:11px}.hero{background:linear-gradient(135deg,#eef8f1,#fff)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.weather{background:#fff;border:1px solid var(--line);border-radius:16px;padding:9px 11px;min-width:120px;text-align:right;box-shadow:var(--shadow)}.temp{font-weight:800;font-size:25px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--green)}.btn{border:0;border-radius:13px;min-height:44px;padding:10px 14px;background:var(--green);color:#fff;font-weight:750}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.search,.field input,.field select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:#fff;font-size:16px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700;color:var(--muted)}.plant{display:flex;gap:12px;align-items:center}.photo{width:68px;height:68px;border-radius:16px;background:#eef2ee;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;font-size:31px;flex:0 0 auto}.photo img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:3px}.task{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.dot{width:10px;height:10px;border-radius:99px}.water{background:var(--blue)}.feed{background:var(--amber)}.prune{background:#6d7928}.repot{background:var(--purple)}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:20}.bottomin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav{border:0;background:transparent;min-height:54px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:700}.nav span{display:block;font-size:21px}.nav.active{background:var(--soft);color:var(--green)}.fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:88px;width:56px;height:56px;border:0;border-radius:18px;background:var(--green);color:#fff;font-size:27px;box-shadow:0 10px 28px rgba(31,111,67,.28);z-index:19}.modal{display:none;position:fixed;inset:0;background:rgba(10,20,13,.38);z-index:40;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:min(760px,100%);max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:17px 16px calc(26px + env(safe-area-inset-bottom))}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.preview{height:130px;border:1px dashed #cbd5cd;border-radius:16px;background:#f1f4f1;display:grid;place-items:center;overflow:hidden;font-size:45px}.preview img{width:100%;height:100%;object-fit:cover}.calhead{display:flex;align-items:center;justify-content:space-between}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:9px}.dayname{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{min-height:62px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;text-align:left}.day.today{outline:2px solid #8ec19e}.day.off{opacity:.35}.daynum{font-weight:800}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}.mdot{width:7px;height:7px;border-radius:99px}.notice{padding:12px;border-radius:14px;background:#f3f6f3;border:1px solid var(--line);font-size:13px}.empty{text-align:center;color:var(--muted);padding:24px 8px}.toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#18211b;color:#fff;padding:10px 13px;border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:1}.weather{min-width:108px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Mi Jardín</h1><div class="sub" id="locLabel">Ribafrecha, La Rioja</div></div><button class="weather" id="weatherBtn"><div class="temp" id="temp">--°</div><div class="sub" id="weatherText">Actualizando…</div></button></header>
<main>
<section class="view active" id="home"></section>
<section class="view" id="plants"></section>
<section class="view" id="calendar"></section>
<section class="view" id="settings"></section>
</main>
</div>
<button class="fab" id="add">＋</button>
<nav class="bottom"><div class="bottomin">
<button class="nav active" data-v="home"><span>⌂</span>Inicio</button>
<button class="nav" data-v="plants"><span>🌿</span>Plantas</button>
<button class="nav" data-v="calendar"><span>▦</span>Calendario</button>
<button class="nav" data-v="settings"><span>⚙︎</span>Ajustes</button>
</div></nav>
<div class="modal" id="modal"><div class="sheet">
<div class="row between"><div><h2 id="formTitle">Añadir planta</h2><div class="sub">Ficha y calendario inicial</div></div><button class="btn secondary" id="close">✕</button></div>
<form id="form"><input type="hidden" id="pid"><div class="grid" style="margin-top:12px">
<div class="field full"><label>Foto</label><div class="preview" id="preview">🌱</div><input type="file" accept="image/*" id="photo"></div>
<div class="field"><label>Nombre</label><input id="pname" required placeholder="Ej. Limonero"></div>
<div class="field"><label>Especie / variedad</label><input id="species" placeholder="Citrus limon"></div>
<div class="field"><label>Zona</label><input id="zone" placeholder="Terraza sur"></div>
<div class="field"><label>Ubicación</label><select id="place"><option>Exterior</option><option>Interior</option><option>Invernadero</option></select></div>
<div class="field"><label>Plantación</label><select id="medium"><option>Maceta</option><option>Suelo</option><option>Jardinera</option></select></div>
<div class="field"><label>Exposición</label><select id="light"><option>Pleno sol</option><option>Semisombra</option><option>Sombra luminosa</option><option>Interior luminoso</option></select></div>
<div class="field"><label>Riego base (días)</label><input id="waterEvery" type="number" min="1" max="60" value="4"></div>
<div class="field"><label>Último riego</label><input id="lastWater" type="date"></div>
<div class="field"><label>Próximo abono</label><input id="nextFeed" type="date"></div>
<div class="field"><label>Próxima poda</label><input id="nextPrune" type="date"></div>
<div class="field"><label>Próximo trasplante</label><input id="nextRepot" type="date"></div>
<div class="field full"><button class="btn" style="width:100%" type="submit">Guardar planta</button></div>
</div></form></div></div>
<div class="modal" id="detail"><div class="sheet" id="detailBody"></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{const K='mi-jardin-v01';const $=id=>document.getElementById(id);const iso=d=>d.toISOString().slice(0,10);const today=()=>iso(new Date());const add=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const seed=()=>({location:'Ribafrecha, La Rioja',coords:{lat:42.3556,lon:-2.3875},weather:null,lastWeatherAt:0,history:[],plants:[
{id:uid(),name:'Limonero',species:'Citrus limon',zone:'Terraza sur',place:'Exterior',medium:'Maceta',light:'Pleno sol',waterEvery:4,lastWater:add(today(),-2),nextFeed:add(today(),8),nextPrune:add(today(),120),nextRepot:add(today(),210),photo:''},
{id:uid(),name:'Romero',species:'Salvia rosmarinus',zone:'Jardín',place:'Exterior',medium:'Suelo',light:'Pleno sol',waterEvery:8,lastWater:add(today(),-5),nextFeed:add(today(),25),nextPrune:add(today(),70),nextRepot:add(today(),300),photo:''},
{id:uid(),name:'Monstera',species:'Monstera deliciosa',zone:'Salón',place:'Interior',medium:'Maceta',light:'Interior luminoso',waterEvery:7,lastWater:add(today(),-4),nextFeed:add(today(),14),nextPrune:add(today(),150),nextRepot:add(today(),180),photo:''}
]});
let state;try{state=JSON.parse(localStorage.getItem(K))||seed()}catch{state=seed()}const save=()=>localStorage.setItem(K,JSON.stringify(state));let current='home',calCursor=new Date(),selected=today(),pendingPhoto='';
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function wsum(){const w=state.weather;if(!w?.current||!w?.daily)return null;const i=w.daily.time.indexOf(today());const rain3=w.daily.precipitation_sum?.slice(Math.max(0,i),Math.max(0,i)+3).reduce((a,b)=>a+(b||0),0)||0;const past=w.daily.precipitation_sum?.slice(0,3).reduce((a,b)=>a+(b||0),0)||0;return{temp:w.current.temperature_2m||0,hum:w.current.relative_humidity_2m||0,wind:w.current.wind_speed_10m||0,rain3,past}}
function waterDate(p){let base=p.waterEvery||5;const w=wsum();if(w){if(w.temp>=30)base=Math.max(1,Math.round(base*.65));else if(w.temp>=25)base=Math.max(1,Math.round(base*.8));if(w.temp<=12)base=Math.round(base*1.35);if(w.rain3>=8&&p.place==='Exterior')base+=3;if(w.past>=10&&p.place==='Exterior')base+=2;if(p.medium==='Suelo')base+=1}return add(p.lastWater||today(),base)}
function tasks(){const a=[];state.plants.forEach(p=>{a.push({id:'w'+p.id,date:waterDate(p),type:'water',title:'Regar',plant:p.name,pid:p.id});if(p.nextFeed)a.push({id:'f'+p.id,date:p.nextFeed,type:'feed',title:'Abonar',plant:p.name,pid:p.id});if(p.nextPrune)a.push({id:'p'+p.id,date:p.nextPrune,type:'prune',title:'Podar',plant:p.name,pid:p.id});if(p.nextRepot)a.push({id:'r'+p.id,date:p.nextRepot,type:'repot',title:'Trasplantar',plant:p.name,pid:p.id})});return a.sort((x,y)=>x.date.localeCompare(y.date))}
function taskRow(t){return '<div class="task"><span class="dot '+t.type+'"></span><div class="grow"><div><b>'+esc(t.title)+'</b> · '+esc(t.plant)+'</div><div class="meta">'+(t.date===today()?'Hoy':fmt(t.date))+'</div></div><button class="btn secondary done" data-id="'+t.id+'">Hecho</button></div>'}
function renderHeader(){ $('locLabel').textContent=state.location;const w=wsum();$('temp').textContent=w?Math.round(w.temp)+'°':'--°';$('weatherText').textContent=w?'Lluvia 3d '+w.rain3.toFixed(1)+' mm':'Toca para actualizar'}
function renderHome(){const ts=tasks(),due=ts.filter(t=>t.date<=today()).slice(0,8),next=ts.filter(t=>t.date>today()).slice(0,5),w=wsum();$('home').innerHTML='<div class="card hero"><div class="row between"><div><div class="sub">Resumen de hoy</div><div style="font-size:28px;font-weight:850">'+due.length+' tareas</div></div><span class="badge">'+state.plants.length+' plantas</span></div>'+(w?'<div class="notice" style="margin-top:12px">Ahora '+Math.round(w.temp)+' °C · humedad '+Math.round(w.hum)+'% · lluvia prevista '+w.rain3.toFixed(1)+' mm. El riego se recalcula con estos datos.</div>':'')+'</div><h2 style="margin-top:16px">Para hacer</h2><div class="card">'+(due.length?due.map(taskRow).join(''):'<div class="empty">No hay tareas vencidas hoy.</div>')+'</div><h2 style="margin-top:16px">Próximamente</h2><div class="card">'+(next.length?next.map(taskRow).join(''):'<div class="empty">Sin tareas próximas.</div>')+'</div>';bindDone()}
function renderPlants(){ $('plants').innerHTML='<input class="search" id="search" placeholder="Buscar planta…"><div id="plist" style="margin-top:12px"></div>';const draw=q=>{const ps=state.plants.filter(p=>(p.name+' '+p.species+' '+p.zone).toLowerCase().includes((q||'').toLowerCase()));$('plist').innerHTML=ps.length?ps.map(p=>'<button class="card plant" style="width:100%;text-align:left" data-p="'+p.id+'"><div class="photo">'+(p.photo?'<img src="'+p.photo+'" alt="">':'🌿')+'</div><div class="grow"><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(p.species||'Sin especie')+' · '+esc(p.zone||'Sin zona')+'</div><div class="meta">Próximo riego: '+fmt(waterDate(p))+'</div></div></button>').join(''):'<div class="empty">No hay plantas.</div>';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openDetail(b.dataset.p))};draw('');$('search').oninput=e=>draw(e.target.value)}
function openDetail(id){const p=state.plants.find(x=>x.id===id);if(!p)return;const wd=waterDate(p),w=wsum();$('detailBody').innerHTML='<div class="row between"><div><h2>'+esc(p.name)+'</h2><div class="sub">'+esc(p.species||'')+'</div></div><button class="btn secondary" id="dclose">✕</button></div><div class="photo" style="width:100%;height:180px;margin:12px 0;font-size:58px">'+(p.photo?'<img src="'+p.photo+'" alt="">':'🌿')+'</div><div class="card"><div><b>Zona:</b> '+esc(p.zone||'—')+'</div><div class="meta">'+esc(p.place)+' · '+esc(p.medium)+' · '+esc(p.light)+'</div></div><div class="card"><div class="row between"><b>Riego</b><span class="badge">'+fmt(wd)+'</span></div><div class="meta" style="margin-top:6px">Base '+p.waterEvery+' días'+(w?' · ajustado por '+Math.round(w.temp)+' °C y '+w.rain3.toFixed(1)+' mm previstos':'')+'</div><button class="btn" id="waterNow" style="width:100%;margin-top:10px">Registrar riego ahora</button></div><div class="card"><div class="task"><span class="dot feed"></span><div class="grow"><b>Abono</b><div class="meta">'+fmt(p.nextFeed)+'</div></div></div><div class="task"><span class="dot prune"></span><div class="grow"><b>Poda</b><div class="meta">'+fmt(p.nextPrune)+'</div></div></div><div class="task"><span class="dot repot"></span><div class="grow"><b>Trasplante</b><div class="meta">'+fmt(p.nextRepot)+'</div></div></div></div><div class="row"><button class="btn secondary grow" id="editP">Editar</button><button class="btn secondary grow" id="deleteP">Eliminar</button></div>';$('detail').classList.add('open');$('dclose').onclick=()=>$('detail').classList.remove('open');$('waterNow').onclick=()=>{p.lastWater=today();state.history.unshift({date:today(),type:'Riego',plant:p.name});save();$('detail').classList.remove('open');renderAll();toast('Riego registrado')};$('editP').onclick=()=>{$('detail').classList.remove('open');openForm(p)};$('deleteP').onclick=()=>{if(confirm('¿Eliminar '+p.name+'?')){state.plants=state.plants.filter(x=>x.id!==p.id);save();$('detail').classList.remove('open');renderAll()}}}
function renderCalendar(){const y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1);start.setDate(1-((first.getDay()+6)%7));const ts=tasks();let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const di=iso(d),ds=ts.filter(t=>t.date===di);cells+='<button class="day '+(d.getMonth()!==m?'off ':'')+(di===today()?'today':'')+'" data-date="'+di+'"><div class="daynum">'+d.getDate()+'</div><div class="dots">'+ds.slice(0,5).map(t=>'<span class="mdot '+t.type+'"></span>').join('')+'</div></button>'}const sel=ts.filter(t=>t.date===selected);$('calendar').innerHTML='<div class="calhead"><button class="btn secondary" id="prev">‹</button><h2 style="margin:0;text-transform:capitalize">'+calCursor.toLocaleDateString('es-ES',{month:'long',year:'numeric'})+'</h2><button class="btn secondary" id="next">›</button></div><div class="cal">'+['L','M','X','J','V','S','D'].map(x=>'<div class="dayname">'+x+'</div>').join('')+cells+'</div><h2 style="margin-top:16px">'+(selected===today()?'Hoy':fmt(selected))+'</h2><div class="card">'+(sel.length?sel.map(taskRow).join(''):'<div class="empty">Sin cuidados programados.</div>')+'</div>';$('prev').onclick=()=>{calCursor=new Date(y,m-1,1);renderCalendar()};$('next').onclick=()=>{calCursor=new Date(y,m+1,1);renderCalendar()};document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;renderCalendar()});bindDone()}
function renderSettings(){const w=wsum();$('settings').innerHTML='<div class="card"><h2>Zona meteorológica</h2><div class="field"><label>Localidad</label><input id="location" value="'+esc(state.location)+'"></div><button class="btn" id="saveLoc" style="width:100%;margin-top:10px">Guardar y actualizar</button>'+(w?'<div class="notice" style="margin-top:10px">Temperatura '+Math.round(w.temp)+' °C · humedad '+Math.round(w.hum)+'% · viento '+Math.round(w.wind)+' km/h · lluvia prevista '+w.rain3.toFixed(1)+' mm.</div>':'')+'</div><div class="card"><h2>Google Calendar</h2><div class="notice">La sincronización OAuth bidireccional se añadirá en la siguiente fase. Esta versión ya exporta todas las tareas en formato .ICS.</div><button class="btn secondary" id="ics" style="width:100%;margin-top:10px">Exportar calendario .ICS</button></div><div class="card"><h2>Zonas del jardín</h2><div class="row wrap">'+([...new Set(state.plants.map(p=>p.zone).filter(Boolean))].map(z=>'<span class="badge">'+esc(z)+'</span>').join('')||'<span class="sub">Sin zonas.</span>')+'</div></div><div class="card"><h2>Diagnóstico por foto</h2><div class="notice">La interfaz ya admite fotos de cada planta. El diagnóstico con IA se conectará en la siguiente fase sin cambiar tus fichas.</div></div>';$('saveLoc').onclick=async()=>{const v=$('location').value.trim();if(!v)return;state.location=v;state.coords=null;save();await weather(true)};$('ics').onclick=exportICS}
function bindDone(){document.querySelectorAll('.done').forEach(b=>b.onclick=()=>completeTask(b.dataset.id))}
function completeTask(id){const t=tasks().find(x=>x.id===id);if(!t)return;const p=state.plants.find(x=>x.id===t.pid);if(!p)return;if(t.type==='water')p.lastWater=today();if(t.type==='feed')p.nextFeed=add(today(),30);if(t.type==='prune')p.nextPrune=add(today(),180);if(t.type==='repot')p.nextRepot=add(today(),365);state.history.unshift({date:today(),type:t.title,plant:p.name});save();renderAll();toast(t.title+' registrado')}
function openForm(p=null){pendingPhoto=p?.photo||'';$('formTitle').textContent=p?'Editar planta':'Añadir planta';$('pid').value=p?.id||'';$('pname').value=p?.name||'';$('species').value=p?.species||'';$('zone').value=p?.zone||'';$('place').value=p?.place||'Exterior';$('medium').value=p?.medium||'Maceta';$('light').value=p?.light||'Pleno sol';$('waterEvery').value=p?.waterEvery||4;$('lastWater').value=p?.lastWater||today();$('nextFeed').value=p?.nextFeed||add(today(),14);$('nextPrune').value=p?.nextPrune||add(today(),120);$('nextRepot').value=p?.nextRepot||add(today(),240);$('preview').innerHTML=pendingPhoto?'<img src="'+pendingPhoto+'" alt="">':'🌱';$('photo').value='';$('modal').classList.add('open')}
$('form').onsubmit=e=>{e.preventDefault();const id=$('pid').value||uid();const p={id,name:$('pname').value.trim(),species:$('species').value.trim(),zone:$('zone').value.trim(),place:$('place').value,medium:$('medium').value,light:$('light').value,waterEvery:Math.max(1,Number($('waterEvery').value)||4),lastWater:$('lastWater').value||today(),nextFeed:$('nextFeed').value,nextPrune:$('nextPrune').value,nextRepot:$('nextRepot').value,photo:pendingPhoto};const i=state.plants.findIndex(x=>x.id===id);if(i>=0)state.plants[i]={...state.plants[i],...p};else state.plants.unshift(p);save();$('modal').classList.remove('open');renderAll();toast(i>=0?'Planta actualizada':'Planta añadida')};
$('photo').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>4*1024*1024){toast('Foto demasiado grande');return}const r=new FileReader();r.onload=()=>{pendingPhoto=r.result;$('preview').innerHTML='<img src="'+pendingPhoto+'" alt="">'};r.readAsDataURL(f)};
async function geocode(){if(state.coords)return state.coords;const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(state.location)+'&count=1&language=es&format=json');const j=await r.json();if(!j.results?.length)throw Error('Localidad no encontrada');const x=j.results[0];state.coords={lat:x.latitude,lon:x.longitude};state.location=[x.name,x.admin1].filter(Boolean).join(', ');save();return state.coords}
async function weather(show){try{$('weatherText').textContent='Actualizando…';const c=await geocode();const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+c.lat+'&longitude='+c.lon+'&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=precipitation_sum&past_days=3&forecast_days=7&timezone=auto');if(!r.ok)throw Error('Error meteorológico');state.weather=await r.json();state.lastWeatherAt=Date.now();save();renderAll();if(show)toast('Meteorología actualizada')}catch(e){$('weatherText').textContent='No disponible';if(show)toast(e.message||'No se pudo actualizar')}}
function exportICS(){const ts=tasks().filter(t=>t.date>=today()&&t.date<=add(today(),120));let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mi Jardin Inteligente//ES','CALSCALE:GREGORIAN'];ts.forEach(t=>lines.push('BEGIN:VEVENT','UID:'+t.id+'@mi-jardin','DTSTART;VALUE=DATE:'+t.date.replaceAll('-',''),'SUMMARY:'+t.title+' - '+t.plant,'DESCRIPTION:Tarea generada por Mi Jardin Inteligente','END:VEVENT'));lines.push('END:VCALENDAR');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/calendar'}));a.download='mi-jardin.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderAll(){renderHeader();renderHome();renderPlants();renderCalendar();renderSettings()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{current=b.dataset.v;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===current));$('add').style.display=current==='settings'?'none':'block';if(current==='plants')renderPlants();if(current==='calendar')renderCalendar();if(current==='settings')renderSettings()});
$('add').onclick=()=>openForm();$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('open')};$('detail').onclick=e=>{if(e.target.id==='detail')$('detail').classList.remove('open')};$('weatherBtn').onclick=()=>weather(true);
renderAll();if(!state.lastWeatherAt||Date.now()-state.lastWeatherAt>30*60*1000)weather(false);
})();
</script>
